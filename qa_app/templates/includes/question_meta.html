{% load i18n %}
<div class="post-meta">
    <span>{{ question.author.username }}</span>
    <time datetime="{{ question.pub_date|date:'c' }}">{{ question.pub_date|date:"SHORT_DATETIME_FORMAT" }}</time>
    {% if question.is_closed %}<span class="badge">{% translate 'closed' %}</span>{% endif %}
    {% for category in question.categories.all %}
        <a href="{% url 'question_list' category.id %}" class="tag">{{ category.name }}</a>
    {% endfor %}
</div>
