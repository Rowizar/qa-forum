<p class="text-muted small">
    {{ question.author.username }}, {{ question.pub_date|date:"d.m.Y H:i" }}
    {% if question.is_closed %}<span class="badge badge-secondary">закрыт</span>{% endif %}
    {% for category in question.categories.all %}
        <a href="{% url 'question_list' category.id %}" class="badge badge-light">{{ category.name }}</a>
    {% endfor %}
</p>
