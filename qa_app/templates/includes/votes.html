{% load i18n %}
{# Expects: up_url, down_url, rating, user_vote (1, -1 or nothing). An anonymous visitor who clicks is sent to the login page. #}
<div class="votes">
    <form method="post" action="{{ up_url }}" data-keep-scroll>
        {% csrf_token %}
        <button type="submit" class="vote-button{% if user_vote == 1 %} is-active{% endif %}" aria-pressed="{% if user_vote == 1 %}true{% else %}false{% endif %}" title="{% translate 'Vote up' %}" aria-label="{% translate 'Vote up' %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
        </button>
    </form>
    <span class="vote-count" title="{% translate 'Rating' %}">{{ rating }}</span>
    <form method="post" action="{{ down_url }}" data-keep-scroll>
        {% csrf_token %}
        <button type="submit" class="vote-button{% if user_vote == -1 %} is-active{% endif %}" aria-pressed="{% if user_vote == -1 %}true{% else %}false{% endif %}" title="{% translate 'Vote down' %}" aria-label="{% translate 'Vote down' %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
    </form>
</div>
