{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% translate 'Sign up' %} · {% endblock %}

{% block layout %}
<main class="wrap layout-narrow">
    <h1>{% translate 'Sign up' %}</h1>
    <form method="post" action="{% url 'register' %}" class="card">
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <button type="submit" class="button button-block">{% translate 'Sign up' %}</button>
    </form>
    <p class="muted">
        {% translate 'Already have an account?' %}
        <a href="{% url 'login' %}">{% translate 'Log in' %}</a>
    </p>
</main>
{% endblock %}
