{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% translate 'Ask a question' %} · {% endblock %}

{% block content %}
    <h1>{% translate 'Ask a question' %}</h1>
    <form method="post" enctype="multipart/form-data" class="card" novalidate>
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <button type="submit" class="button">{% translate 'Post question' %}</button>
    </form>
{% endblock %}
