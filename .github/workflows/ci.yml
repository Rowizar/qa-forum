# Runs on every push and pull request: linter, Django checks and tests.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Not a real secret: Django only needs some value to start.
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Models and migrations are in sync
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test
